enabled: true
blog-page: '/blog'

# Site Information
site:
  name: 'Your Site Name'
  tagline: 'Your Tagline'
  url: 'https://yoursite.com'
  
# Social Media
social:
  twitter: '@YourTwitterHandle'
  
# Images
# Set these via Admin > Themes > Anonymous > Images, or drop files into this theme's images/ folder.
# IMPORTANT: do NOT hard-code 'theme://images/*.png' here. A `type: file` field treats a pre-set
# string as an unresolved stored value and renders a "Value theme://images/logo.png" error in Admin.
# Leave them empty so the upload widget starts clean.
images:
  logo: ''
  og_image: ''
  favicon: ''

# Theme Settings
theme:
  matrix_effect: true
  glitch_effect: true
